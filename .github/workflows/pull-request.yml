name: Pull Request
on: 
  pull_request:
    types: [opened, synchronize, edited]
    branches:
      - main

jobs:
  # Note: To change bot exclusion condition, update both job 'if' conditions below
  pr-title-lint:
    name: Validate PR Title
    runs-on: ubuntu-latest
    if: "${{ !startsWith(github.event.pull_request.title, 'chore(main): release') }}"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate PR title
        run: |
          echo "${{ github.event.pull_request.title }}" | npx commitlint

  commit-lint:
    name: Validate Commit Messages
    runs-on: ubuntu-latest
    if: "${{ !startsWith(github.event.pull_request.title, 'chore(main): release') }}"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate commit messages
        run: |
          git log -1 --pretty=format:"%s" ${{ github.event.pull_request.head.sha }} | npx commitlint --verbose
